name: ci
on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the run still in progress for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:budgets

  determinism:
    # The sim determinism lint runs only here, in its own job, so a determinism break is visible at a glance.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:determinism
      - run: npx vitest run tests/unit/golden.test.ts

  playwright:
    # Runs in parallel with the other jobs. Each browser is split into four shards.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        browser: [chromium, webkit]
        include:
          - browser: chromium
            projects: --project=desktop-chromium --project=phone-portrait --project=chromium-360x640 --project=chromium-1920x1080
          - browser: webkit
            projects: --project=webkit-360x640 --project=webkit-1920x1080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --shard=${{ matrix.shard }}/4 ${{ matrix.projects }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
