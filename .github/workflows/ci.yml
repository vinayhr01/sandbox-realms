name: ci
on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the run still in progress for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:budgets

  determinism:
    # The sim determinism lint runs only here, in its own job, so a determinism break is visible at a glance.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run check:determinism
      - run: npx --no-install vitest run tests/unit/golden.test.ts

  playwright:
    # Runs in parallel with the other jobs. Each browser is split into six shards, by test (fullyParallel).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        browser: [chromium]
        include:
          - browser: chromium
            projects: --project=desktop-chromium --project=phone-portrait --project=chromium-360x640 --project=chromium-1920x1080
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      # The creature perf gate runs alone in the perf job: two workers on a shared runner would skew its frame times.
      - run: npx --no-install playwright test --shard=${{ matrix.shard }}/6${{ matrix.projects }}
        env:
          SR_SKIP_PERF: '1'
          SR_SKIP_3D: '1'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e-3d:
    # The 3D specs (software WebGL) on their own runners, one worker each: on a shard's two workers they starved each
    # other. Two shards, so this job is no longer the slowest in the run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npx --no-install playwright test tests/e2e/view3d.spec.ts tests/e2e/view-switch.spec.ts tests/e2e/perf-3d.spec.ts --project=desktop-chromium --project=phone-portrait-3d --workers=1 --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: playwright-3d-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  perf:
    # The creature perf gate (P95 of the creature pipeline) on its own runner, one worker, so nothing else competes for the CPU.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npx --no-install playwright test tests/e2e/perf-creatures.spec.ts --project=desktop-chromium --workers=1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: playwright-perf
          path: test-results/
          retention-days: 7

  deploy:
    # Publishes the built game to GitHub Pages (https://vinayhr01.github.io/sandbox-realms/) after every check passes on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, determinism, playwright, perf, e2e-3d]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE: /sandbox-realms/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
