name: pages
# Manual publish or rollback: pick any branch, tag or commit and publish its build to GitHub Pages.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to publish (for example checkpoint-2026-10-25)'
        required: true
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

# A rollback in progress is never cancelled by a second click.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE: /sandbox-realms/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
